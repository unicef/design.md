name: Quarto Screenshot Baseline

on:
  workflow_dispatch:
  pull_request:
    paths:
      - site/**
      - .github/workflows/screenshots.yml

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render site
        run: quarto render site

      - name: Install Playwright Chromium
        run: npx -y playwright install --with-deps chromium

      - name: Start local preview server
        run: python3 -m http.server 4173 --directory site/_site >/tmp/quarto-screenshot-server.log 2>&1 &

      - name: Wait for server
        run: sleep 2

      - name: Capture baseline screenshots
        run: |
          mkdir -p artifacts/screenshots
          npx -y playwright screenshot --browser chromium --device "Desktop Chrome" --full-page --wait-for-timeout 1000 http://127.0.0.1:4173/index.html artifacts/screenshots/index-light.png
          npx -y playwright screenshot --browser chromium --device "Desktop Chrome" --full-page --wait-for-timeout 1000 http://127.0.0.1:4173/stories.html artifacts/screenshots/stories-light.png
          npx -y playwright screenshot --browser chromium --device "Desktop Chrome" --full-page --wait-for-timeout 1000 http://127.0.0.1:4173/posts/storytelling-page/ artifacts/screenshots/storytelling-light.png
          npx -y playwright screenshot --browser chromium --device "Desktop Chrome" --full-page --wait-for-timeout 1000 http://127.0.0.1:4173/posts/data-figures/ artifacts/screenshots/data-light.png
          npx -y playwright screenshot --browser chromium --device "Desktop Chrome" --color-scheme dark --full-page --wait-for-timeout 1000 http://127.0.0.1:4173/stories.html artifacts/screenshots/stories-dark.png

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: quarto-screenshot-baseline
          path: artifacts/screenshots
