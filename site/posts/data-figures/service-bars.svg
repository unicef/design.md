<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative service comparison chart</title>
  <desc id="desc">A simple bar chart comparing three categories in UNICEF blue, dark blue, and gold.</desc>
  <rect width="960" height="540" fill="#FFFFFF"/>
  <text x="60" y="60" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#000000">Illustrative service comparison</text>
  <line x1="110" y1="430" x2="860" y2="430" stroke="#BEBAB6" stroke-width="2"/>
  <line x1="110" y1="130" x2="110" y2="430" stroke="#BEBAB6" stroke-width="2"/>
  <rect x="190" y="220" width="140" height="210" fill="#00AEEF"/>
  <rect x="410" y="270" width="140" height="160" fill="#0047BB"/>
  <rect x="630" y="180" width="140" height="250" fill="#FFB500"/>
  <text x="205" y="470" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#000000">Health</text>
  <text x="422" y="470" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#000000">Water</text>
  <text x="626" y="470" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#000000">Learning</text>
  <text x="245" y="205" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#000000">78</text>
  <text x="465" y="255" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#000000">64</text>
  <text x="685" y="165" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#000000">91</text>
</svg>
